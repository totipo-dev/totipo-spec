name: Totipo v1 conformance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.23.x', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: conformance/go.sum
      - name: Spec structure
        run: |
          python3 tools/check_spec.py
          python3 tools/check_vectors.py
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l conformance)"
      - name: Vet and tests
        working-directory: conformance
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Manifest-driven conformance
        run: go run ./conformance/cmd/totipo-conformance -root .
      - name: Manifest and profile integrity
        run: go run ./conformance/cmd/totipo-conformance -root . -verify-only
      - name: Race tests
        if: runner.os == 'Linux'
        working-directory: conformance
        run: go test -race -count=1 ./...
      - name: Bounded parser fuzzing
        if: runner.os == 'Linux'
        run: make fuzz
