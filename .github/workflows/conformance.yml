name: Totipo v1 conformance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.23.x', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: conformance/go.sum
      - name: Spec structure
        run: |
          python3 tools/check_spec.py
          python3 tools/check_vectors.py
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l conformance)"
      - name: Vet and tests
        working-directory: conformance
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Manifest-driven conformance
        run: go run ./conformance/cmd/totipo-conformance -root .
      - name: Manifest and profile integrity
        run: go run ./conformance/cmd/totipo-conformance -root . -verify-only
      - name: Race tests
        if: runner.os == 'Linux'
        working-directory: conformance
        run: go test -race -count=1 ./...
      - name: Bounded parser fuzzing
        if: runner.os == 'Linux'
        run: make fuzz
